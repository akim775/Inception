version: '3'

services:
    mariadb:
        build: ./requirements/mariadb
        container_name: mariadb
        restart: always
        env_file:
            - .env
        networks:
            - inception
        volumes:
            - mariadb:/var/lib/mysql

    wordpress:
        build: ./requirements/wordpress
        container_name: wordpress
        restart: always
        depends_on:
            - mariadb
        env_file:
            - .env
        networks:
            - inception
        volumes:
            - wordpress:/var/www/wordpress

    nginx:
        build: ./requirements/nginx
        container_name: nginx
        restart: always
        depends_on:
            - wordpress
        ports:
            - "443:443"
        env_file:
            - .env
        networks:
            - inception
        volumes:
            - wordpress:/var/www/wordpress

networks:
    inception:
        driver: bridge

volumes:
    wordpress:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/ahamini/data/wordpress
    mariadb:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/ahamini/data/mariadb
